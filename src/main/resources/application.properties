spring.application.name=budgeting

# =====================
# Spring AI - Gemini
# =====================
spring.ai.openai.api-key=AIzaSyDx6oHzb1DMrOp2nNnFaHLxHdqD2_K4PbE
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-2.0-flash

# Whisper via OpenAI (transcrição de áudio)
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.response-format=text

# =====================
# Banco de Dados (H2 em memória)
# =====================
spring.datasource.url=jdbc:h2:mem:budgeting;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================
# Upload de áudio
# =====================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.port=8081
logging.level.dio.budgeting=DEBUG
logging.level.org.springframework.ai=DEBUG